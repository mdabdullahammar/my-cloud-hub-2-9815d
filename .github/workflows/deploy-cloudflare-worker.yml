name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "index.html"
      - ".github/workflows/deploy-cloudflare-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Prepare static frontend
        run: mkdir -p public && cp index.html public/index.html

      - name: Apply D1 migrations
        run: wrangler d1 migrations apply my-private-cloud-hub-db --remote

      - name: Deploy Worker and static frontend
        run: wrangler deploy 
